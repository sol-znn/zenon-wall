# The page on a Vite dev server, reading the Supabase project named in .env.
#
#   cp .env.example .env
#   docker compose up
#
# Page: http://127.0.0.1:5174
#
# The indexer does not run here. It runs from .github/workflows/indexer.yml,
# or `npm start` in indexer/ on an always-on host.

name: zenon-wall

services:
  web:
    # Not alpine: nom-ui is a git dependency, and npm needs git to fetch it.
    image: node:24-bookworm
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5174"
    environment:
      npm_config_allow_git: all
      # File events do not cross a Docker Desktop bind mount from Windows.
      CHOKIDAR_USEPOLLING: 'true'
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      VITE_ZNN_CHAIN_ID: ${ZNN_CHAIN_ID}
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules
    ports:
      - 127.0.0.1:5174:5174

volumes:
  web_modules:
